<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio of Prabhnoor Singh, Computer Science student at Saint Louis University interested in cybersecurity and product management."
    />
    <title>Prabhnoor Singh | Portfolio</title>
    <script>
      // Apply the saved theme before React loads so the page doesn't flash light.
      try {
        if (localStorage.getItem("portfolio-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
